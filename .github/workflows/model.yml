# Unlock The Count: model runs
#
# Cloudflare deploys the site by itself whenever main changes (connect the repository once in
# Cloudflare: Workers & Pages > Create > Import a repository). This workflow only runs the model.
#
# Every day: run the tests and a STAGING run. The report shows on the Actions page; nothing live changes.
# To go LIVE: Actions tab > "Model" > Run workflow > target: live. That reruns the tests, publishes the
# numbers to public/data/ and commits them to main, and Cloudflare deploys the update.
name: Model

on:
  schedule:
    - cron: "17 11 * * *"        # 6:17am Eastern, every day
  workflow_dispatch:
    inputs:
      target:
        description: "staging or live"
        required: true
        default: staging
        type: choice
        options: [staging, live]
  push:
    branches: [main]
    paths: ["config/**", "engine/**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - name: Tests (rules, Python vs. website, simulator)
        working-directory: engine
        run: python -m unittest discover -s tests -v

  staging:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run the model (staging)
        working-directory: engine
        run: |
          python -m ktr run --env staging
          cat ../build/staging/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: staging-run, path: build/staging }

  live:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run the model (live)
        working-directory: engine
        run: |
          python -m ktr run --env live
          cat ../build/staging/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the new numbers (Cloudflare deploys them)
        run: |
          git config user.name "ktr-model"
          git config user.email "ktr-model@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "Model run $(date -u +%F)"
          git push
