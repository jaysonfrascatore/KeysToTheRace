# Publishes the site (the public/ folder) to GitHub Pages on every change to main:
# https://jaysonfrascatore.github.io/KeysToTheRace/
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Model", "Polls"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # After Model or Polls, only deploy when that run actually changed the site:
    # a Polls run, or a live Model run started by hand. The daily staging run changes nothing live.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Polls' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
