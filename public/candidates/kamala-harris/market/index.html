<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html,body{background:#0b0a08;margin:0}html[data-theme="light"],html[data-theme="light"] body{background:#f8faf9}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamala Harris: Viability Market</title>
<meta name="description" content="Kamala Harris's Viability Market: the polling forecast if Kamala Harris runs, and the path to the nomination.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/site.css">
<meta name="theme-color" content="#0b0a08">
<script>
// Opened from a computer (no server), this page can't load the data: use the candidates page instead
if (location.protocol === "file:") location.replace("../../../candidates/index.html#m-kamala-harris");
(function () {
  let t = "dark";
  try { t = localStorage.getItem("ktr-theme") || "dark"; } catch (e) {}
  const h = document.documentElement; h.dataset.theme = t; h.classList.toggle("dark", t === "dark");
})();
</script>
</head>
<body>
<header class="nav" data-nav data-root="../../../" data-active="candidates"></header>
<main class="wrap pdp-full" id="page"><p class="note" style="padding:60px 0">Loading Kamala Harris…</p></main>
<footer data-footer data-root="../../../"></footer>
<script>window.PAGE_ROOT = "../../../"; window.DATA_ROOT = "../../../data/"; window.CAND_PAGE = true;</script>
<script src="../../../assets/nav.js"></script>
<script src="../../../assets/common.js"></script>
<script src="../../../assets/polls-core.js"></script>
<script src="../../../assets/market.js"></script>
<script src="../../../assets/count.js"></script>
<script>
loadMarket().then(M => {
  window.MARKET = M;
  const c = M.all.find(x => x.id === "kamala-harris"), page = document.getElementById("page");
  if (!c) { page.innerHTML = '<p class="note" style="padding:60px 0">This candidate isn\'t tracked right now. <a href="../../../candidates/">See every candidate</a></p>'; return; }
  page.innerHTML = marketHTML(c, M);
  page.querySelectorAll("[data-close]").forEach(a => { a.removeAttribute("data-close"); a.href = "../../../candidates/"; });
  wireOverlay(page);
  PDP.route();
});
</script>
</body>
</html>
