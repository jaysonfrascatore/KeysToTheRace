<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html,body{background:#0b0a08;margin:0}html[data-theme="light"],html[data-theme="light"] body{background:#f8faf9}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<meta name="theme-color" content="#0b0a08">
<script>
/* Theme: dark by default; the sun/moon button switches it and the choice is saved.
   Add ?theme=light or ?theme=dark to the URL to preview. */
(function () {
  let t = "dark";
  try { t = localStorage.getItem("ktr-theme") || "dark"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark") t = q;
  const h = document.documentElement;
  h.dataset.theme = t; h.classList.toggle("dark", t === "dark");
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#0b0a08" : "#f8faf9");
})();
</script>
</head>
<body>
<header class="nav" data-nav data-root="/"></header>
<section class="page-hero">
  <div class="wrap" data-head>
    <div class="eyebrow">404</div>
    <h1>This page <span>isn't on the map.</span></h1>
    <p>The link may be old, or the page may have moved. Try one of the keys in the menu, or head back to the homepage.</p>
    <nav class="jump"><a href="/">Homepage</a><a href="/candidates/">Key Candidates</a><a href="/polls/">Key Polls</a><a href="/matchups/">Key Matchups</a></nav>
  </div>
</section>
<footer data-footer data-root="/"></footer>
<script src="/assets/nav.js"></script>
</body>
</html>
