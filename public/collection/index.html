<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html,body{background:#0b0a08;margin:0}html[data-theme="light"],html[data-theme="light"] body{background:#f8faf9}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collection</title>
<meta name="description" content="Every Keys to the Race project, live and coming soon: trackers, forecasts, maps and Florida tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<meta name="theme-color" content="#0b0a08">
<script>
/* Theme: dark by default; the sun/moon button switches it and the choice is saved.
   Add ?theme=light or ?theme=dark to the URL to preview. */
(function () {
  let t = "dark";
  try { t = localStorage.getItem("ktr-theme") || "dark"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark") t = q;
  const h = document.documentElement;
  h.dataset.theme = t; h.classList.toggle("dark", t === "dark");
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#0b0a08" : "#f8faf9");
})();
</script>
</head>
<body>

<header class="nav" data-nav data-root="../" data-active="collection"></header>

<main>
<section class="page-hero">
  <div class="wrap" data-head>
    <h1>The <span>Collection.</span></h1>
    <p>Every tracker, forecast and map, live and coming soon. Open any piece to see what's inside.</p>
    <nav class="jump"><a href="#available">Available now</a><a href="#soon">Coming soon</a></nav>
  </div>
</section>

<section class="block" id="available">
  <div class="wrap" data-reveal>
    <div class="sec-head"><div><div class="eyebrow">Available now</div><h2>On the <em>shelf.</em></h2><p>Live and in early access.</p></div></div>
    <div class="store" id="storeNow"></div>
  </div>
</section>

<section class="block" id="soon">
  <div class="wrap" data-reveal>
    <div class="sec-head"><div><div class="eyebrow">Coming soon</div><h2>In the <em>workshop.</em></h2><p>Being built now.</p></div></div>
    <div class="store" id="storeSoon"></div>
  </div>
</section>
</main>

<footer data-footer data-root="../"></footer>

<script>window.PAGE_ROOT = "../";</script>
<script src="../assets/nav.js"></script>
<script src="../assets/common.js"></script>
<script src="../assets/collection.js"></script>
<script>
renderCollection("#storeNow", p => p.status !== "soon");
renderCollection("#storeSoon", p => p.status === "soon");
PDP.route();
</script>
</body>
</html>
