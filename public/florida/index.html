<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html,body{background:#0b0a08;margin:0}html[data-theme="light"],html[data-theme="light"] body{background:#f8faf9}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Florida Keys</title>
<meta name="description" content="Florida Vote Tracker, the Florida Legislature and build-your-own forecasts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
.fl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fl-card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.fl-card h3{font-size:18px;font-weight:600}
.fl-card p{font-size:14px;color:var(--ink-2)}
.fl-card .chip{margin-top:auto}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--foam)}
.stat span{font-size:13px;color:var(--ink-3)}
@media (max-width:960px){ .fl-grid{grid-template-columns:1fr} }
@media (max-width:560px){ .stat-row{grid-template-columns:1fr} }
</style>
<meta name="theme-color" content="#0b0a08">
<script>
/* Theme: dark by default; the sun/moon button switches it and the choice is saved.
   Add ?theme=light or ?theme=dark to the URL to preview. */
(function () {
  let t = "dark";
  try { t = localStorage.getItem("ktr-theme") || "dark"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("theme");
  if (q === "light" || q === "dark") t = q;
  const h = document.documentElement;
  h.dataset.theme = t; h.classList.toggle("dark", t === "dark");
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", t === "dark" ? "#0b0a08" : "#f8faf9");
})();
</script>
</head>
<body>

<header class="nav" data-nav data-root="../" data-active="florida"></header>

<section class="page-hero">
  <div class="wrap" data-head>
    <div class="eyebrow">The Florida Keys</div>
    <h1>Florida, <span>county by county.</span></h1>
    <p>The home of Florida Vote Tracker: live turnout, D vs R vs NPA margins, the Florida Legislature and build-your-own forecasts.</p>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="stat-row">
      <div class="stat"><b>67</b><span>counties tracked</span></div>
      <div class="stat"><b>120</b><span>Florida House seats</span></div>
      <div class="stat"><b>40</b><span>Florida Senate seats</span></div>
    </div>
    <div class="fl-grid" id="flGrid"></div>
  </div>
</section>

<footer data-footer data-root="../"></footer>
<script src="../assets/nav.js"></script>
<script src="../assets/common.js"></script>
<script>
$("#flGrid").innerHTML = FLORIDA_TOOLS.map(t => `
  <div class="fl-card" id="${t.page.split("#")[1]}">
    <div class="eyebrow">Florida</div>
    <h3>${t.name}</h3>
    <p>${t.desc}</p>
    ${chip(t.status)}
  </div>`).join("");
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
